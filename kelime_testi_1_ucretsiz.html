<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Zamanlayıcılı Hızlı Kelime Testi 1 | Hamza Hoca ile Türkçe Öğreniyorum</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #0D1B2A 0%, #1a2a3a 100%);
  min-height: 100vh;
  color: white;
}

.page-wrapper {
  max-width: 720px;
  margin: 0 auto;
  padding: 40px 20px 80px;
}

header { text-align: center; margin-bottom: 28px; }
header h1 {
  font-size: clamp(1.3rem, 5vw, 1.9rem);
  font-weight: 800;
  color: #F5C842;
  line-height: 1.3;
  margin-bottom: 12px;
}
.header-line {
  width: 80px; height: 2px;
  background: linear-gradient(90deg, transparent, #F5C842, transparent);
  margin: 0 auto 12px;
}
.subtitle { font-size: 0.78rem; color: rgba(255,255,255,0.55); letter-spacing: .06em; }

.stat-bar {
  display: flex; justify-content: center; gap: 18px;
  margin-bottom: 22px; flex-wrap: wrap;
}
.stat-box {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(245,200,66,0.25);
  border-radius: 10px;
  padding: 9px 18px;
  text-align: center;
  min-width: 84px;
}
.stat-box .num { font-size: 1.2rem; font-weight: 700; color: #F5C842; }
.stat-box .lbl { font-size: 0.65rem; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: .05em; }

.timer-track {
  height: 8px;
  border-radius: 5px;
  background: rgba(255,255,255,0.1);
  overflow: hidden;
  margin-bottom: 26px;
}
.timer-fill {
  height: 100%;
  background: linear-gradient(90deg, #F5C842, #FF8C42);
  border-radius: 5px;
  width: 100%;
  transition: width 0.1s linear;
}
.timer-fill.danger { background: linear-gradient(90deg, #E15759, #ff8080); }

.question-box {
  background: rgba(255,255,255,0.05);
  border: 1.5px solid rgba(245,200,66,0.3);
  border-radius: 14px;
  padding: 34px 24px;
  text-align: center;
  margin-bottom: 24px;
}
.q-label {
  font-size: 0.72rem;
  color: rgba(255,255,255,0.5);
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: 10px;
}
.q-word {
  font-size: clamp(1.8rem, 7vw, 2.4rem);
  font-weight: 800;
  color: #F5C842;
}

.options-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}
@media (max-width: 540px) { .options-grid { grid-template-columns: 1fr; } }

.option-btn {
  background: rgba(255,255,255,0.06);
  border: 1.5px solid rgba(255,255,255,0.14);
  border-radius: 10px;
  padding: 14px 16px;
  font-size: 0.92rem;
  line-height: 1.4;
  color: white;
  cursor: pointer;
  text-align: left;
  transition: all 0.15s ease;
}
.option-btn:hover:not(:disabled) { border-color: rgba(245,200,66,0.5); background: rgba(255,255,255,0.1); }
.option-btn:disabled { cursor: default; }
.option-btn.correct { border-color: #4CAF50; background: rgba(76,175,80,0.2); color: #8fd08f; }
.option-btn.wrong { border-color: #E15759; background: rgba(225,87,89,0.2); color: #ffb3b3; }

.controls { display: flex; justify-content: center; margin-top: 28px; }
.btn {
  background: transparent;
  border: 1.5px solid #F5C842;
  color: #F5C842;
  padding: 10px 22px;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: .03em;
  transition: all 0.2s ease;
}
.btn:hover { background: #F5C842; color: #0D1B2A; }

.end-box {
  display: none;
  text-align: center;
  padding: 32px 24px;
  background: rgba(255,255,255,0.06);
  border: 1.5px solid rgba(245,200,66,0.35);
  border-radius: 14px;
}
.end-box.show { display: block; }
.end-box h2 { color: #F5C842; font-size: 1.3rem; margin-bottom: 14px; }
.end-box .result-line { font-size: 0.95rem; color: rgba(255,255,255,0.8); margin-bottom: 6px; }

.back-link {
  display: block;
  text-align: center;
  margin-top: 30px;
  color: rgba(255,255,255,0.4);
  font-size: 0.8rem;
  text-decoration: none;
}
.back-link:hover { color: #F5C842; }
</style>
</head>
<body>
<div class="page-wrapper">

  <header>
    <h1>⚡Kelime Testi 1</h1>
    <div class="header-line"></div>
    <div class="subtitle">B2 / C1 SEVİYESİ &middot; SÜRE DOLMADAN DOĞRU ANLAMI SEÇİN</div>
  </header>

  <div class="stat-bar">
    <div class="stat-box"><div class="num" id="statQ">1/15</div><div class="lbl">Soru</div></div>
    <div class="stat-box"><div class="num" id="statScore">0</div><div class="lbl">Puan</div></div>
    <div class="stat-box"><div class="num" id="statStreak">0</div><div class="lbl">Seri</div></div>
  </div>

  <div class="timer-track"><div class="timer-fill" id="timerFill"></div></div>

  <div id="gameArea">
    <div class="question-box">
      <div class="q-label">Bu kelimenin anlamı nedir?</div>
      <div class="q-word" id="qWord"></div>
    </div>
    <div class="options-grid" id="optionsGrid"></div>
  </div>

  <div class="end-box" id="endBox">
    <h2 id="endTitle">🎉 Test Tamamlandı!</h2>
    <div class="result-line" id="endScore"></div>
    <div class="result-line" id="endCorrect"></div>
    <div class="result-line" id="endStreak"></div>
  </div>

  <div class="controls">
    <button class="btn" onclick="restartGame()">🔄 Yeniden Başlat</button>
  </div>

  <a class="back-link" href="yeni_index.html">← Ana Sayfaya Dön</a>

</div>

<script>
const words = [
  { word: "tutarlı", correct: "Sözleri veya davranışları birbiriyle çelişmeyen, mantıklı",
    wrong: ["Çabuk sinirlenip öfkelenen", "Cömert ve eli açık olan", "Kolayca herkese güvenen"] },
  { word: "yetersiz", correct: "Bir ihtiyacı karşılamaya gücü veya bilgisi yetmeyen",
    wrong: ["Aşırı derecede özenli ve titiz", "Çok konuşkan ve girişken", "Kolayca bulunabilen, ucuz"] },
  { word: "belirgin", correct: "Açıkça görülen, kolay fark edilen",
    wrong: ["Gizli kalan, fark edilmeyen", "Hiçbir değeri olmayan", "Sayı ile ölçülemeyen"] },
  { word: "ihmal etmek", correct: "Bir görevi gerektiği gibi yapmayıp savsaklamak",
    wrong: ["Bir işi büyük özenle yapmak", "Bir şeyi başkasıyla paylaşmak", "Bir konuyu derinlemesine araştırmak"] },
  { word: "tedbirli", correct: "Kötü bir duruma karşı önceden önlem alan",
    wrong: ["Sonucu hiç düşünmeden davranan", "Her işte acele eden", "Elindekini kolayca harcayan"] },
  { word: "yansıtmak", correct: "Bir düşünce veya durumu açıkça ortaya koymak",
    wrong: ["Bir bilgiyi gizli tutmak", "Bir şeyin miktarını ölçmek", "Bir teklifi geri çevirmek"] },
  { word: "çelişki", correct: "Birbirine ters düşen, birbirini tutmayan durum",
    wrong: ["Tam bir uyum içindeki birliktelik", "Kesin ve tartışmasız sonuç", "Ortaklaşa alınan karar"] },
  { word: "öngörmek", correct: "Bir olayın ileride nasıl gelişeceğini önceden tahmin etmek",
    wrong: ["Yaşanmış bir olayı unutmak", "Bir olayın gerçekleşmesini engellemek", "Verilen bir kararı onaylamak"] },
  { word: "sürdürülebilir", correct: "Uzun süre aynı şekilde devam ettirilebilen",
    wrong: ["Çok kısa sürede sona eren", "Aniden ve beklenmedik biçimde değişen", "Bir daha asla tekrarlanamayan"] },
  { word: "kapsamlı", correct: "Geniş bir alanı içine alan, ayrıntılı",
    wrong: ["Dar bir alanla sınırlı olan", "Sadece yüzeysel bilgi veren", "Belirsiz ve net olmayan"] },
  { word: "varsaymak", correct: "Kesin bilgi olmadan bir şeyi doğru kabul etmek",
    wrong: ["Bir iddiayı kesin kanıtlarla ispatlamak", "Bir görüşü tamamen reddetmek", "Unutulan bir bilgiyi hatırlamak"] },
  { word: "gözden geçirmek", correct: "Bir şeyi yeniden inceleyip kontrol etmek",
    wrong: ["Bir şeyi ilk kez sıfırdan oluşturmak", "Bir belgeyi tamamen ortadan kaldırmak", "Bir seçimi rastgele yapmak"] },
  { word: "hoşgörülü", correct: "Başkalarının hata ve kusurlarına karşı anlayışlı davranan",
    wrong: ["Küçük şeylere bile kolayca sinirlenen", "Herkesten şüphelenen, güvenmeyen", "Başkalarının başarısını kıskanan"] },
  { word: "karmaşık", correct: "Anlaşılması veya çözülmesi zor, girift",
    wrong: ["Kolayca anlaşılan, sade", "Kısa ve açık biçimde ifade edilen", "Tek bir unsurdan oluşan"] },
  { word: "istikrarlı", correct: "Sürekli aynı düzeyde kalan, kararlı ve değişmeyen",
    wrong: ["Sürekli iniş çıkış gösteren, değişken", "Aniden ve düşünmeden karar alan", "Sonucu önceden kestirilemeyen"] }
];

const TOTAL = words.length;
const DURATIONS = [15,15,15,15,15,15,15,15,15,15,15,15,15,15,15]; // 15 saniye

let order = [];
let currentIndex = 0;
let score = 0;
let streak = 0;
let bestStreak = 0;
let correctCount = 0;
let timerInterval = null;
let timeLeft = 0;
let questionDuration = 0;
let answered = false;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function buildOrder() {
  order = shuffle(words.map((w, i) => i));
}

function loadQuestion() {
  answered = false;
  const wIdx = order[currentIndex];
  const item = words[wIdx];

  document.getElementById('qWord').textContent = item.word;
  document.getElementById('statQ').textContent = `${currentIndex + 1}/${TOTAL}`;

  const options = shuffle([
    { text: item.correct, correct: true },
    ...item.wrong.map(t => ({ text: t, correct: false }))
  ]);

  const grid = document.getElementById('optionsGrid');
  grid.innerHTML = '';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.className = 'option-btn';
    btn.textContent = opt.text;
    btn.onclick = () => selectAnswer(btn, opt.correct);
    grid.appendChild(btn);
  });

  questionDuration = DURATIONS[currentIndex] * 1000;
  startTimer();
}

function startTimer() {
  clearInterval(timerInterval);
  timeLeft = questionDuration;
  const fill = document.getElementById('timerFill');
  fill.style.transition = 'none';
  fill.style.width = '100%';
  fill.classList.remove('danger');
  requestAnimationFrame(() => { fill.style.transition = 'width 0.1s linear'; });

  const tickMs = 100;
  timerInterval = setInterval(() => {
    timeLeft -= tickMs;
    const pct = Math.max(0, (timeLeft / questionDuration) * 100);
    fill.style.width = pct + '%';
    if (pct < 30) fill.classList.add('danger');
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      if (!answered) handleTimeout();
    }
  }, tickMs);
}

function handleTimeout() {
  answered = true;
  streak = 0;
  document.getElementById('statStreak').textContent = streak;
  const buttons = document.querySelectorAll('.option-btn');
  buttons.forEach(b => {
    b.disabled = true;
    if (b.textContent === words[order[currentIndex]].correct) b.classList.add('correct');
  });
  setTimeout(nextQuestion, 1100);
}

function selectAnswer(btn, isCorrect) {
  if (answered) return;
  answered = true;
  clearInterval(timerInterval);

  const buttons = document.querySelectorAll('.option-btn');
  buttons.forEach(b => { b.disabled = true; });

  if (isCorrect) {
    btn.classList.add('correct');
    const timeBonus = Math.ceil((timeLeft / questionDuration) * 5);
    score += 10 + timeBonus;
    streak++;
    correctCount++;
    if (streak > bestStreak) bestStreak = streak;
  } else {
    btn.classList.add('wrong');
    streak = 0;
    buttons.forEach(b => {
      if (b.textContent === words[order[currentIndex]].correct) b.classList.add('correct');
    });
  }

  document.getElementById('statScore').textContent = score;
  document.getElementById('statStreak').textContent = streak;

  setTimeout(nextQuestion, 1100);
}

function nextQuestion() {
  currentIndex++;
  if (currentIndex >= TOTAL) {
    endGame();
  } else {
    loadQuestion();
  }
}

function endGame() {
  clearInterval(timerInterval);
  document.getElementById('gameArea').style.display = 'none';
  document.getElementById('timerFill').parentElement.style.display = 'none';

  const box = document.getElementById('endBox');
  document.getElementById('endScore').textContent = `Toplam Puan: ${score}`;
  document.getElementById('endCorrect').textContent = `Doğru Sayısı: ${correctCount}/${TOTAL}`;
  document.getElementById('endStreak').textContent = `En Uzun Doğru Serisi: ${bestStreak}`;

  let title = '👍 Test Tamamlandı!';
  if (correctCount === TOTAL) title = '🏆 Mükemmel! Hepsi Doğru!';
  else if (correctCount >= TOTAL * 0.7) title = '🎉 Harika Sonuç!';
  document.getElementById('endTitle').textContent = title;

  box.classList.add('show');
}

function restartGame() {
  clearInterval(timerInterval);
  currentIndex = 0;
  score = 0;
  streak = 0;
  bestStreak = 0;
  correctCount = 0;
  document.getElementById('statScore').textContent = '0';
  document.getElementById('statStreak').textContent = '0';
  document.getElementById('endBox').classList.remove('show');
  document.getElementById('gameArea').style.display = 'block';
  document.getElementById('timerFill').parentElement.style.display = 'block';
  buildOrder();
  loadQuestion();
}

buildOrder();
loadQuestion();
</script>
</body>
</html>
