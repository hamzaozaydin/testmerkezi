<!DOCTYPE html>
<html lang="tr">
<head>
  <script>
  if (!sessionStorage.getItem('hamzaUser')) {
    alert('Bu sayfa sadece üyeler içindir. Lütfen giriş yapın.');
    window.location.replace('index.html');
  }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Deyim Eşleştirme Oyunu 2 | Hamza Hoca ile Türkçe Öğreniyorum</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #0D1B2A 0%, #1a2a3a 100%);
  min-height: 100vh;
  color: white;
}

.page-wrapper {
  max-width: 900px;
  margin: 0 auto;
  padding: 40px 20px 80px;
}

header { text-align: center; margin-bottom: 36px; }
header h1 {
  font-size: clamp(1.4rem, 5vw, 2rem);
  font-weight: 800;
  color: #F5C842;
  line-height: 1.3;
  margin-bottom: 14px;
}
.header-line {
  width: 80px; height: 2px;
  background: linear-gradient(90deg, transparent, #F5C842, transparent);
  margin: 0 auto 12px;
}
.subtitle { font-size: 0.8rem; color: rgba(255,255,255,0.55); letter-spacing: .08em; }

.stat-bar {
  display: flex; justify-content: center; gap: 24px;
  margin-bottom: 28px; flex-wrap: wrap;
}
.stat-box {
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(245,200,66,0.25);
  border-radius: 10px;
  padding: 10px 20px;
  text-align: center;
  min-width: 100px;
}
.stat-box .num { font-size: 1.3rem; font-weight: 700; color: #F5C842; }
.stat-box .lbl { font-size: 0.7rem; color: rgba(255,255,255,0.6); text-transform: uppercase; letter-spacing: .05em; }

.game-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 32px;
}
@media (max-width: 640px) {
  .game-grid { grid-template-columns: 1fr; gap: 20px; }
}

.col-label {
  font-size: 0.85rem;
  font-weight: 700;
  color: rgba(255,255,255,0.55);
  text-transform: uppercase;
  letter-spacing: .08em;
  margin-bottom: 12px;
  padding-bottom: 8px;
  border-bottom: 2px solid rgba(245,200,66,0.3);
}

.card {
  background: rgba(255,255,255,0.06);
  border: 1.5px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  padding: 14px 16px;
  margin-bottom: 10px;
  cursor: pointer;
  font-size: 0.95rem;
  line-height: 1.4;
  transition: all 0.2s ease;
  user-select: none;
}
.card:hover { border-color: rgba(245,200,66,0.5); background: rgba(255,255,255,0.1); }

.card.selected {
  border-color: #F5C842;
  background: rgba(245,200,66,0.15);
  box-shadow: 0 0 0 2px rgba(245,200,66,0.3);
}
.card.matched {
  border-color: #4CAF50;
  background: rgba(76,175,80,0.15);
  color: rgba(255,255,255,0.85);
  cursor: default;
  opacity: 0.85;
}
.card.popping {
  animation: popOut 2s ease forwards;
  pointer-events: none;
}
@keyframes popOut {
  0%   { transform: scale(1); opacity: 1; }
  15%  { transform: scale(1.18); opacity: 1; }
  85%  { transform: scale(1.05); opacity: 1; }
  100% { transform: scale(0); opacity: 0; margin-bottom: 0; padding-top: 0; padding-bottom: 0; }
}
.confetti-piece {
  position: fixed;
  top: 0; left: 0;
  pointer-events: none;
  z-index: 9999;
  opacity: 1;
  border-radius: 1px;
  transform: translate(0,0) rotate(0deg);
  transition: transform 2s cubic-bezier(0.25,0.46,0.45,0.94), opacity 2s ease-in;
}
.confetti-piece.animate {
  transform: translate(var(--dx), var(--dy)) rotate(var(--rot));
  opacity: 0;
}
.card.wrong {
  border-color: #E15759;
  background: rgba(225,87,89,0.18);
  animation: shake 0.35s;
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  25% { transform: translateX(-5px); }
  75% { transform: translateX(5px); }
}
.card.deyim { font-weight: 700; color: #F5C842; }
.card.matched.deyim { color: #8fd08f; }

.controls {
  display: flex; justify-content: center; gap: 14px;
  margin-top: 32px; flex-wrap: wrap;
}
.btn {
  background: transparent;
  border: 1.5px solid #F5C842;
  color: #F5C842;
  padding: 10px 22px;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: .03em;
  transition: all 0.2s ease;
}
.btn:hover { background: #F5C842; color: #0D1B2A; }

.win-box {
  display: none;
  text-align: center;
  margin-top: 28px;
  padding: 24px;
  background: rgba(76,175,80,0.12);
  border: 1.5px solid #4CAF50;
  border-radius: 12px;
}
.win-box.show { display: block; }
.win-box h2 { color: #8fd08f; margin-bottom: 8px; font-size: 1.2rem; }
.win-box p { color: rgba(255,255,255,0.75); font-size: 0.9rem; }

.back-link {
  display: block;
  text-align: center;
  margin-top: 30px;
  color: rgba(255,255,255,0.4);
  font-size: 0.8rem;
  text-decoration: none;
}
.back-link:hover { color: #F5C842; }

.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(255,255,255,0.06);
  border: 1.5px solid rgba(245,200,66,0.35);
  color: #F5C842;
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
  text-decoration: none;
  margin-bottom: 20px;
  transition: all 0.2s ease;
}
.back-btn:hover {
  background: #F5C842;
  color: #0D1B2A;
  border-color: #F5C842;
}
</style>
</head>
<body>
<div class="page-wrapper">

  <button class="back-btn" onclick="history.back()">← Geri</button>

  <header>
    <h1>🔗 Deyim Eşleştirme 1</h1>
    <div class="header-line"></div>
    <div class="subtitle">DEYİMİ SOL SÜTUNDAN, ANLAMINI SAĞ SÜTUNDAN SEÇEREK EŞLEŞTİRİN</div>
  </header>

  <div class="stat-bar">
    <div class="stat-box"><div class="num" id="statMatched">0/10</div><div class="lbl">Eşleşen</div></div>
    <div class="stat-box"><div class="num" id="statTries">0</div><div class="lbl">Deneme</div></div>
    <div class="stat-box"><div class="num" id="statTime">00:00</div><div class="lbl">Süre</div></div>
  </div>

  <div class="game-grid">
    <div>
      <div class="col-label">Deyimler</div>
      <div id="deyimCol"></div>
    </div>
    <div>
      <div class="col-label">Anlamlar</div>
      <div id="anlamCol"></div>
    </div>
  </div>

  <div class="win-box" id="winBox">
    <h2>🎉 Tebrikler, tüm deyimleri eşleştirdiniz!</h2>
    <p id="winStats"></p>
  </div>

  <div class="controls">
    <button class="btn" onclick="restartGame()">🔄 Yeniden Başlat</button>
  </div>


</div>

<script>
const idioms = [
  { id: 1, deyim: "Ağzı var dili yok", anlam: "Çok az konuşan, sessiz biri" },
  { id: 2, deyim: "Burnu büyümek", anlam: "Kibirlenmek, kendini beğenmiş olmak" },
  { id: 3, deyim: "Eli ayağı dolaşmak", anlam: "Heyecandan şaşırıp ne yapacağını bilememek" },
  { id: 4, deyim: "Göz boyamak", anlam: "Aldatmak, yanıltıcı bir görüntü vermek" },
  { id: 5, deyim: "Kafası karışmak", anlam: "Zihni dağılmak, ne yapacağını bilememek" },
  { id: 6, deyim: "Kulağına küpe olsun", anlam: "Bir öğüdü unutmamak üzere iyice akılda tutmak" },
  { id: 7, deyim: "Yüreği ağzına gelmek", anlam: "Çok korkmak veya heyecanlanmak" },
  { id: 8, deyim: "Dile getirmek", anlam: "Bir düşünceyi sözle ifade etmek" },
  { id: 9, deyim: "El üstünde tutmak", anlam: "Birine çok değer vermek, saygı göstermek" },
  { id: 10, deyim: "Kafadan atmak", anlam: "Düşünmeden, uydurarak konuşmak" }
];

let selectedDeyim = null;
let selectedAnlam = null;
let matchedCount = 0;
let tries = 0;
let startTime = null;
let timerInterval = null;

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function renderGame() {
  const deyimCol = document.getElementById('deyimCol');
  const anlamCol = document.getElementById('anlamCol');
  deyimCol.innerHTML = '';
  anlamCol.innerHTML = '';

  const shuffledDeyim = shuffle(idioms);
  const shuffledAnlam = shuffle(idioms);

  shuffledDeyim.forEach(item => {
    const div = document.createElement('div');
    div.className = 'card deyim';
    div.dataset.id = item.id;
    div.textContent = item.deyim;
    div.onclick = () => selectCard(div, 'deyim', item.id);
    deyimCol.appendChild(div);
  });

  shuffledAnlam.forEach(item => {
    const div = document.createElement('div');
    div.className = 'card anlam';
    div.dataset.id = item.id;
    div.textContent = item.anlam;
    div.onclick = () => selectCard(div, 'anlam', item.id);
    anlamCol.appendChild(div);
  });
}

function selectCard(el, type, id) {
  if (el.classList.contains('matched')) return;

  if (type === 'deyim') {
    if (selectedDeyim) selectedDeyim.el.classList.remove('selected');
    selectedDeyim = { el, id };
    el.classList.add('selected');
  } else {
    if (selectedAnlam) selectedAnlam.el.classList.remove('selected');
    selectedAnlam = { el, id };
    el.classList.add('selected');
  }

  if (selectedDeyim && selectedAnlam) {
    tries++;
    document.getElementById('statTries').textContent = tries;
    checkMatch();
  }
}

const CONFETTI_COLORS = ['#F5C842', '#4CAF50', '#E15759', '#5B9BD5', '#FFFFFF', '#FF8C42'];

function spawnConfetti(x, y) {
  const count = 18;
  for (let i = 0; i < count; i++) {
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.background = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
    const size = 5 + Math.random() * 5;
    p.style.width = size + 'px';
    p.style.height = (size * 0.6) + 'px';
    p.style.left = x + 'px';
    p.style.top = y + 'px';

    const angle = Math.random() * Math.PI * 2;
    const distance = 70 + Math.random() * 130;
    const dx = Math.cos(angle) * distance;
    const dy = Math.sin(angle) * distance + 90;
    const rot = Math.random() * 1080 - 540;
    p.style.setProperty('--dx', dx + 'px');
    p.style.setProperty('--dy', dy + 'px');
    p.style.setProperty('--rot', rot + 'deg');

    document.body.appendChild(p);
    requestAnimationFrame(() => p.classList.add('animate'));
    setTimeout(() => p.remove(), 2000);
  }
}

function popCard(el) {
  const rect = el.getBoundingClientRect();
  spawnConfetti(rect.left + rect.width / 2, rect.top + rect.height / 2);
  el.classList.add('popping');
  setTimeout(() => { el.style.display = 'none'; }, 2000);
}

function checkMatch() {
  const d = selectedDeyim;
  const a = selectedAnlam;

  if (d.id === a.id) {
    d.el.classList.remove('selected');
    a.el.classList.remove('selected');
    d.el.classList.add('matched');
    a.el.classList.add('matched');
    popCard(d.el);
    popCard(a.el);
    matchedCount++;
    document.getElementById('statMatched').textContent = matchedCount + '/10';
    selectedDeyim = null;
    selectedAnlam = null;
    if (matchedCount === 10) endGame();
  } else {
    d.el.classList.add('wrong');
    a.el.classList.add('wrong');
    setTimeout(() => {
      d.el.classList.remove('selected', 'wrong');
      a.el.classList.remove('selected', 'wrong');
      selectedDeyim = null;
      selectedAnlam = null;
    }, 450);
  }
}

function startTimer() {
  startTime = Date.now();
  timerInterval = setInterval(() => {
    const elapsed = Math.floor((Date.now() - startTime) / 1000);
    const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
    const secs = String(elapsed % 60).padStart(2, '0');
    document.getElementById('statTime').textContent = `${mins}:${secs}`;
  }, 1000);
}

function endGame() {
  clearInterval(timerInterval);
  const timeText = document.getElementById('statTime').textContent;
  document.getElementById('winStats').textContent = `Toplam deneme: ${tries} · Süre: ${timeText}`;
  document.getElementById('winBox').classList.add('show');
}

function restartGame() {
  clearInterval(timerInterval);
  selectedDeyim = null;
  selectedAnlam = null;
  matchedCount = 0;
  tries = 0;
  document.getElementById('statMatched').textContent = '0/10';
  document.getElementById('statTries').textContent = '0';
  document.getElementById('statTime').textContent = '00:00';
  document.getElementById('winBox').classList.remove('show');
  renderGame();
  startTimer();
}

renderGame();
startTimer();
</script>
</body>
</html>
